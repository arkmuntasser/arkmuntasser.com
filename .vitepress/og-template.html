<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.google.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" />
    <style>
			*, *::after, *::before {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html, body {
				margin: 0;
				padding: 0;
				height: 100%;
			}

      .og {
				--brand-color: oklch(0.64 0.25 15.46);
				--bg-color: oklch(from var(--brand-color) 99% 0.01 h / 0.6);

				--text-size-1: 4rem;
				--text-size-2: 2.488rem;
				--text-size-3: 2.074rem;
				--text-size-4: 1.728rem;
				--text-size-5: 1.44rem;
				--text-size-6: 1.2rem;
				--text-size-7: 1rem;
				--text-size-8: 0.833rem;
				--text-size-9: 0.694rem;

				display: grid;
				grid-template-rows: 1fr min-content;
    		gap: 2rem;

				padding-block: 3rem;
				padding-inline: 4rem;
				width: 1200px;
        height: 630px;
        font-family: "Outfit", system-ui, sans-serif;
        color: #342e28;
				background-color: var(--bg-color);
				/* background: linear-gradient(180deg, transparent 50%, var(--brand-color) 100%); */

				:where(h1, h2, h3, h4, h5, h6) {
					font-weight: 700;
					line-height: 1.25;
					text-wrap: balance;

					position: relative;

					&::before {
						content: '⁕' "";
						color: var(--brand-color);

						position: absolute;
						inset-inline-start: 0;
						inset-block-start: 0;
						z-index: -1;
						pointer-events: none;
						translate: -50% -25%;
						opacity: 0.8;
					}
				}

				:where(h1) {
					margin-top: 3rem;
					font-size: var(--text-size-1);
				}

				.credits {
					align-self: end;
    			justify-self: end;
					text-align: right;
				}

				.logo {
					font-size: 1.5rem;
					font-weight: 700;
					text-decoration: none;
					color: inherit;

					& b {
						color: var(--brand-color);
						font-size: 1.3em;
						opacity: 0.8;
					}
				}

				.path { font-size: 1.3rem; }
      }
    </style>
  </head>
  <body>
    <div class="og">
      <h1>{{title}}</h1>
			<div class="credits">
				<p class="logo"><span><b>@</b>arkmuntasser.com</span></p>
				<p class="path">{{url}}</p>
			</div>
    </div>
  </body>
</html>
